<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy - Supplier Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { farmgreen: '#16a34a', farmyellow: '#f59e0b' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl relative pb-20 overflow-hidden">
        
        <!-- Header -->
        <header class="bg-purple-700 text-white p-5 rounded-b-3xl shadow-md flex items-center justify-between sticky top-0 z-40">
            <div class="flex items-center">
                <a href="farmer-dashboard.html" class="mr-4 text-purple-200 hover:text-white transition">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <div>
                    <h2 class="font-bold text-xl"><i class="fas fa-store mr-2"></i><span data-i18n="agri_inputs">Agri-Inputs</span></h2>
                    <p class="text-purple-200 text-xs mt-1" data-i18n="verified_supplies">Verified organic supplies</p>
                </div>
            </div>
            <!-- 🌐 Language Switcher -->
            <select id="langSwitcher" onchange="changeLanguage(this.value)" class="bg-white/20 text-white border border-white/30 rounded-lg px-2 py-1 text-xs font-bold outline-none cursor-pointer">
                <option value="en" class="text-gray-900">EN</option>
                <option value="hi" class="text-gray-900">HI</option>
                <option value="kn" class="text-gray-900">KN</option>
            </select>
        </header>

        <!-- VIEW 1: CATEGORIES GRID -->
        <div id="categoryView" class="p-5 mt-2 block">
            <h3 class="font-bold text-gray-900 mb-4 text-lg" data-i18n="shop_category">Shop by Category</h3>
            <div id="categoryGrid" class="grid grid-cols-2 gap-4">
                <p class="text-xs text-gray-500 italic col-span-2 text-center py-10"><i class="fas fa-spinner fa-spin mr-2"></i> Loading store...</p>
            </div>
        </div>

        <!-- VIEW 2: PRODUCT LIST -->
        <div id="productView" class="p-5 mt-2 hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="showCategories()" class="text-xs font-bold text-purple-600 bg-purple-100 px-3 py-1.5 rounded-full hover:bg-purple-200 transition flex items-center">
                    <i class="fas fa-arrow-left mr-1.5"></i> Back
                </button>
                <h3 id="currentCategoryTitle" class="font-bold text-gray-900 text-lg uppercase tracking-wide">Category</h3>
            </div>
            
            <div id="productGrid" class="grid grid-cols-2 gap-4">
                <!-- Products load here -->
            </div>
        </div>

        <!-- 🛒 CHECKOUT MODAL -->
        <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex-col justify-end">
            <div class="bg-white rounded-t-3xl p-6 shadow-2xl transition-all">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-extrabold text-xl text-gray-900">Checkout</h3>
                    <button onclick="closeCheckout()" class="text-gray-400 hover:text-gray-700 bg-gray-100 rounded-full h-8 w-8 flex justify-center items-center shadow-sm">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-5">
                    <p class="text-[10px] text-purple-600 font-bold uppercase tracking-wider" id="checkoutCategory">Category</p>
                    <h4 class="font-bold text-gray-900 text-md mt-1" id="checkoutItemName">Product Name</h4>
                    <p class="text-xs text-gray-500 mt-1" id="checkoutSupplier"><i class="fas fa-building mr-1"></i>Supplier</p>
                    
                    <div class="mt-3 flex items-center justify-between bg-white border border-gray-200 rounded-lg p-2">
                        <span class="text-xs font-bold text-gray-600">Quantity</span>
                        <div class="flex items-center space-x-3">
                            <button onclick="updateCheckoutQty(-1)" class="h-6 w-6 rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-600 hover:bg-gray-200">-</button>
                            <span id="checkoutQty" class="font-bold text-sm">1</span>
                            <button onclick="updateCheckoutQty(1)" class="h-6 w-6 rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-600 hover:bg-gray-200">+</button>
                        </div>
                    </div>

                    <div class="mt-3 pt-3 border-t border-gray-200 flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-600">Grand Total:</span>
                        <span class="font-extrabold text-purple-700 text-xl" id="checkoutPrice">₹0</span>
                    </div>
                </div>

                <h4 class="font-bold text-gray-700 text-xs uppercase tracking-wide mb-3">Select Payment Method</h4>
                <div class="space-y-3">
                    <button onclick="processPayment('App')" id="btnPayApp" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-md transition flex justify-between items-center px-5">
                        <div class="flex items-center">
                            <i class="fas fa-wallet text-xl mr-3"></i>
                            <div class="text-left">
                                <span class="block text-sm">Pay via Frendzy Wallet</span>
                                <span class="block text-[9px] text-purple-200 font-normal">Instant digital payment</span>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-purple-300"></i>
                    </button>

                    <button onclick="processPayment('Store')" id="btnPayStore" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-xl shadow-md transition flex justify-between items-center px-5">
                        <div class="flex items-center">
                            <i class="fas fa-store-alt text-xl mr-3"></i>
                            <div class="text-left">
                                <span class="block text-sm">Pay at Store</span>
                                <span class="block text-[9px] text-gray-400 font-normal">Reserve now, pay on pickup</span>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-gray-500"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        const translations = {
            en: { agri_inputs: "Agri-Inputs", verified_supplies: "Verified organic supplies", shop_category: "Shop by Category" },
            hi: { agri_inputs: "कृषि-इनपुट", verified_supplies: "सत्यापित जैविक आपूर्ति", shop_category: "श्रेणी के अनुसार खरीदें" },
            kn: { agri_inputs: "ಕೃಷಿ-ಇನ್ಪುಟ್ಗಳು", verified_supplies: "ಪರಿಶೀಲಿಸಿದ ಸಾವಯವ ಸರಬರಾಜು", shop_category: "ವರ್ಗದ ಮೂಲಕ ಶಾಪಿಂಗ್ ಮಾಡಿ" }
        };

        function changeLanguage(langCode) {
            localStorage.setItem('frendzy_lang', langCode);
            if(document.getElementById('langSwitcher')) document.getElementById('langSwitcher').value = langCode;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[langCode] && translations[langCode][key]) el.innerText = translations[langCode][key];
            });
        }
        document.addEventListener("DOMContentLoaded", () => { changeLanguage(localStorage.getItem('frendzy_lang') || 'en'); });

        let allStoreItems = [];
        let globalCategories = [];
        let currentSelectedItem = null;
        let checkoutQuantity = 1;
        let loggedInFarmer = JSON.parse(localStorage.getItem('frendzy_user') || 'null');

        async function initStore() {
            try {
                const catRes = await fetch('http://localhost:3000/api/admin/categories?target=SUPPLIER');
                globalCategories = await catRes.json();
            } catch (err) { console.error("Could not load category styles"); }

            try {
                const response = await fetch('http://localhost:3000/api/inputs');
                allStoreItems = await response.json();
                renderCategories();
            } catch (error) {
                document.getElementById('categoryGrid').innerHTML = '<p class="text-xs text-red-500 text-center font-bold col-span-2">Store temporarily offline.</p>';
            }
        }

        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            const activeCategories = [...new Set(allStoreItems.map(item => item.category))];
            
            if (activeCategories.length === 0) {
                grid.innerHTML = '<p class="text-xs text-gray-500 italic col-span-2 text-center">No categories found in store.</p>';
                return;
            }

            grid.innerHTML = '';
            activeCategories.forEach(catName => {
                const count = allStoreItems.filter(i => i.category === catName).length;
                const style = globalCategories.find(c => c.name === catName) || { icon: 'fa-box', color: 'text-purple-600', bg: 'bg-purple-50' };
                
                grid.innerHTML += `
                    <div onclick="openCategory('${catName}')" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center cursor-pointer hover:shadow-md hover:-translate-y-1 transition-all">
                        <div class="h-16 w-16 ${style.bg} ${style.color} rounded-full flex items-center justify-center mb-3">
                            <i class="fas ${style.icon} text-2xl"></i>
                        </div>
                        <h3 class="font-bold text-gray-800 text-center leading-tight">${catName}</h3>
                        <p class="text-[10px] text-gray-400 font-bold mt-1">${count} Items</p>
                    </div>
                `;
            });
        }

        function openCategory(categoryName) {
            document.getElementById('categoryView').classList.add('hidden');
            document.getElementById('productView').classList.remove('hidden');
            document.getElementById('currentCategoryTitle').innerText = categoryName;

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filteredItems = allStoreItems.filter(item => item.category === categoryName);
            filteredItems.forEach(item => {
                const organicBadge = item.is_organic ? `<span class="absolute top-2 left-2 bg-green-500 text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow uppercase tracking-wide">100% Organic</span>` : '';
                const inStock = item.quantity > 0;
                const btnHtml = inStock 
                    ? `<button onclick='openCheckout(${JSON.stringify(item)})' class="bg-purple-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-purple-700 transition shadow-sm">Buy</button>`
                    : `<span class="text-[10px] font-bold text-red-500 bg-red-50 px-2 py-1 rounded-md">Out of Stock</span>`;

                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col transition hover:shadow-md ${!inStock ? 'opacity-70' : ''}">
                        <div class="h-32 w-full relative bg-gray-200">
                            <img src="${item.image_url}" class="w-full h-full object-cover">
                            ${organicBadge}
                        </div>
                        <div class="p-3 flex flex-col flex-grow">
                            <h4 class="font-bold text-gray-900 text-xs mt-0.5 mb-1 leading-tight line-clamp-2">${item.product_name}</h4>
                            <p class="text-[9px] text-gray-500 truncate"><i class="fas fa-building mr-1"></i>${item.supplier_name}</p>
                            
                            <div class="mt-auto pt-3 flex justify-between items-end">
                                <div>
                                    <span class="font-extrabold text-gray-900 text-sm block leading-none">₹${item.price}</span>
                                    <span class="text-[9px] text-gray-400 font-normal">/ ${item.unit_size || 'unit'}</span>
                                </div>
                                ${btnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function showCategories() {
            document.getElementById('categoryView').classList.remove('hidden');
            document.getElementById('productView').classList.add('hidden');
        }

        function openCheckout(item) {
            if (!loggedInFarmer || loggedInFarmer.role !== 'FARMER') {
                alert("Please log in to your Farmer account to buy supplies.");
                window.location.href = 'farmer-dashboard.html';
                return;
            }

            currentSelectedItem = item;
            checkoutQuantity = 1;
            
            document.getElementById('checkoutCategory').innerText = item.category;
            document.getElementById('checkoutItemName').innerText = `${item.product_name} (${item.unit_size || 'Unit'})`;
            document.getElementById('checkoutSupplier').innerHTML = `<i class="fas fa-building mr-1"></i>${item.supplier_name} - Only ${item.quantity} left in stock`;
            
            updateCheckoutDisplay();
            
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.getElementById('checkoutModal').classList.add('flex');
        }

        function updateCheckoutQty(change) {
            if (checkoutQuantity + change > 0 && checkoutQuantity + change <= currentSelectedItem.quantity) {
                checkoutQuantity += change;
                updateCheckoutDisplay();
            }
        }

        function updateCheckoutDisplay() {
            document.getElementById('checkoutQty').innerText = checkoutQuantity;
            document.getElementById('checkoutPrice').innerText = `₹${currentSelectedItem.price * checkoutQuantity}`;
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
            document.getElementById('checkoutModal').classList.remove('flex');
            currentSelectedItem = null;
        }

        async function processPayment(method) {
            if (!currentSelectedItem) return;

            const btnApp = document.getElementById('btnPayApp');
            const btnStore = document.getElementById('btnPayStore');
            
            if(method === 'App') btnApp.innerHTML = '<i class="fas fa-spinner fa-spin mx-auto text-xl"></i>';
            if(method === 'Store') btnStore.innerHTML = '<i class="fas fa-spinner fa-spin mx-auto text-xl"></i>';

            const orderPayload = {
                item_name: `${currentSelectedItem.product_name} (${currentSelectedItem.unit_size || 'Unit'})`,
                quantity: checkoutQuantity,
                total_price: currentSelectedItem.price * checkoutQuantity,
                supplier_phone: currentSelectedItem.supplier_phone,
                buyer_phone: loggedInFarmer.phone,
                buyer_id: loggedInFarmer.name,
                status: 'Pending'
            };

            try {
                const res = await fetch('http://localhost:3000/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });

                if (res.ok) {
                    closeCheckout();
                    if (method === 'App') {
                        alert(`✅ Payment Processed via Frendzy Wallet!\n\nYour order has been sent to ${currentSelectedItem.supplier_name}. They will prepare it for you.`);
                    } else {
                        alert(`✅ Item Reserved!\n\nYour order is confirmed. Please pay ₹${orderPayload.total_price} when you pick it up from ${currentSelectedItem.supplier_name}.`);
                    }
                    initStore(); 
                } else {
                    alert("Failed to process order.");
                }
            } catch (err) {
                alert("Connection error. Could not place order.");
            }
            
            btnApp.innerHTML = `<div class="flex items-center"><i class="fas fa-wallet text-xl mr-3"></i><div class="text-left"><span class="block text-sm">Pay via Frendzy Wallet</span><span class="block text-[9px] text-purple-200 font-normal">Instant digital payment</span></div></div><i class="fas fa-chevron-right text-purple-300"></i>`;
            btnStore.innerHTML = `<div class="flex items-center"><i class="fas fa-store-alt text-xl mr-3"></i><div class="text-left"><span class="block text-sm">Pay at Store</span><span class="block text-[9px] text-gray-400 font-normal">Reserve now, pay on pickup</span></div></div><i class="fas fa-chevron-right text-gray-500"></i>`;
        }

        initStore();
    </script>
</body>
</html>
