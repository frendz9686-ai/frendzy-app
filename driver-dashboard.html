<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy - Driver Logistics Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { bluehub: '#2563eb' } } } }
    </script>
</head>
<body class="bg-gray-900 font-sans text-gray-100">

    <div class="max-w-md mx-auto bg-gray-950 min-h-screen shadow-2xl relative pb-24 overflow-hidden border-x border-gray-800">
        
        <header class="bg-bluehub text-white p-4 rounded-b-3xl shadow-md flex justify-between items-center sticky top-0 z-40">
            <div>
                <h2 class="font-bold text-lg"><i class="fas fa-truck-moving mr-2"></i>Logistics Hub</h2>
                <p class="text-blue-100 text-xs">Active Driver Dispatches</p>
            </div>
            <button onclick="clearSession()" id="logoutBtn" class="hidden text-xs bg-blue-900 px-3 py-1.5 rounded-full">Logout</button>
        </header>

        <!-- AUTH GATEWAY (LOGIN & REGISTER WITH DL & RC) -->
        <div id="authView" class="p-5 mt-4 block">
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                <div class="flex bg-gray-800 rounded-xl p-1 mb-6">
                    <button onclick="switchAuthTab('login')" id="tabLogin" class="flex-1 py-2 text-xs font-bold bg-bluehub text-white rounded-lg transition">Login</button>
                    <button onclick="switchAuthTab('register')" id="tabRegister" class="flex-1 py-2 text-xs font-bold text-gray-400 rounded-lg transition">Register Driver</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-4 block">
                    <input type="tel" id="loginPhone" required placeholder="Phone Number" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none">
                    <input type="password" id="loginPin" required maxlength="4" placeholder="4-Digit PIN" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white text-center tracking-widest outline-none">
                    <button type="submit" class="w-full bg-bluehub text-white font-bold py-3.5 rounded-xl">Start Shift</button>
                </form>

                <!-- Registration Form with DL & RC Photo Uploads[cite: 8] -->
                <form id="registerForm" class="space-y-3 hidden">
                    <input type="text" id="regName" required placeholder="Full Name" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none">
                    <input type="tel" id="regPhone" required placeholder="Phone Number" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white outline-none">
                    <input type="password" id="regPin" required maxlength="4" placeholder="Create 4-Digit PIN" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white text-center tracking-widest outline-none">
                    
                    <div>
                        <label class="block text-[11px] font-bold text-gray-300 mb-1"><i class="fas fa-id-card text-blue-400 mr-1"></i> Upload Driving License (DL) Photo</label>
                        <input type="file" id="regDlPhoto" accept="image/*" required class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gray-800 file:text-blue-400 cursor-pointer">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-300 mb-1"><i class="fas fa-file-alt text-blue-400 mr-1"></i> Upload Vehicle RC Photo</label>
                        <input type="file" id="regRcPhoto" accept="image/*" required class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gray-800 file:text-blue-400 cursor-pointer">
                    </div>

                    <button type="submit" class="w-full bg-bluehub text-white font-bold py-3.5 rounded-xl mt-2">Register Driver & Verify</button>
                </form>
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="dashboardView" class="hidden p-4 space-y-4">
            <h3 class="font-bold text-white text-base"><i class="fas fa-clipboard-list text-blue-500 mr-2"></i>Available Transport Loads</h3>
            <div id="jobFeed" class="space-y-3">
                <p class="text-xs text-gray-500 text-center italic py-6">Searching loads...</p>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav id="bottomNav" class="absolute bottom-0 left-0 right-0 bg-gray-950 border-t border-gray-800 px-6 py-3 flex justify-around items-center z-50 hidden">
            <button onclick="fetchJobs()" class="flex flex-col items-center text-blue-500"><i class="fas fa-map text-base"></i><span class="text-[10px] font-bold">Loads</span></button>
        </nav>
    </div>

    <script>
        let currentDriver = JSON.parse(localStorage.getItem('frendzy_driver') || 'null');
        let dlBase64 = "";
        let rcBase64 = "";

        if (currentDriver) activateDashboard();

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('tabLogin').className = "flex-1 py-2 text-xs font-bold bg-bluehub text-white rounded-lg transition";
                document.getElementById('tabRegister').className = "flex-1 py-2 text-xs font-bold text-gray-400 rounded-lg transition";
                document.getElementById('loginForm').classList.replace('hidden', 'block');
                document.getElementById('registerForm').classList.replace('block', 'hidden');
            } else {
                document.getElementById('tabRegister').className = "flex-1 py-2 text-xs font-bold bg-bluehub text-white rounded-lg transition";
                document.getElementById('tabLogin').className = "flex-1 py-2 text-xs font-bold text-gray-400 rounded-lg transition";
                document.getElementById('registerForm').classList.replace('hidden', 'block');
                document.getElementById('loginForm').classList.replace('block', 'hidden');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const driverObj = { name: "Registered Driver", phone };
            localStorage.setItem('frendzy_driver', JSON.stringify(driverObj));
            window.location.reload();
        });

        document.getElementById('regDlPhoto').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = ev => dlBase64 = ev.target.result;
            reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('regRcPhoto').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = ev => rcBase64 = ev.target.result;
            reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const driverObj = { 
                name: document.getElementById('regName').value, 
                phone: document.getElementById('regPhone').value,
                dl_photo: dlBase64,
                rc_photo: rcBase64
            };
            localStorage.setItem('frendzy_driver', JSON.stringify(driverObj));
            window.location.reload();
        });

        function clearSession() { localStorage.removeItem('frendzy_driver'); window.location.reload(); }

        function activateDashboard() {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            fetchJobs();
        }

        async function fetchJobs() {
            const feed = document.getElementById('jobFeed');
            try {
                const res = await fetch('http://localhost:3000/api/logistics/feed');
                const jobs = await res.json();
                if(jobs.length === 0) {
                    feed.innerHTML = `<p class="text-xs text-gray-500 text-center py-6 bg-gray-900 rounded-xl border border-gray-800">No active shipping loads right now.</p>`;
                    return;
                }
                feed.innerHTML = jobs.map(j => `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow-sm space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[9px] bg-blue-950 text-blue-400 font-bold px-2 py-0.5 rounded uppercase">${j.requester_role} Dispatch</span>
                                <h4 class="font-bold text-white text-base mt-1">${j.item_name}</h4>
                            </div>
                            <span class="text-green-400 font-extrabold text-base">₹${Math.max(350, j.quantity_kg * 2.5)} Payout</span>
                        </div>
                        <div class="space-y-1 text-xs text-gray-300 bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                            <p><strong>Pickup:</strong> ${j.pickup_location}</p>
                            <p><strong>Drop:</strong> ${j.drop_location}</p>
                            <p><strong>Weight:</strong> ${j.quantity_kg} kg (${j.vehicle_required})</p>
                        </div>
                        <button onclick="acceptJob('${j._id}')" class="w-full bg-bluehub text-white font-bold py-2.5 rounded-xl text-xs">Accept Dispatch</button>
                    </div>`).join('');
            } catch(e) { feed.innerHTML = `<p class="text-xs text-red-400 text-center">Failed to load dispatches.</p>`; }
        }

        async function acceptJob(id) {
            await fetch(`http://localhost:3000/api/logistics/${id}/accept`, {
                method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ driver_phone: currentDriver.phone })
            });
            alert("Trip accepted!"); fetchJobs();
        }
    </script>
</body>
</html>
