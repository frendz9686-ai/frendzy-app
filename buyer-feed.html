<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy - Buyer Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { farmgreen: '#16a34a', farmyellow: '#f59e0b' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl relative pb-20 overflow-hidden">
        
        <header class="bg-white p-5 rounded-b-3xl shadow-sm border-b sticky top-0 z-40 flex justify-between items-center">
            <div>
                <h2 class="font-extrabold text-2xl text-gray-900"><span class="text-farmgreen">Frendzy</span> Market</h2>
                <p class="text-gray-500 text-xs mt-0.5">Buy directly from local farmers</p>
            </div>
            <select id="langSwitcher" onchange="changeLanguage(this.value)" class="bg-gray-100 border rounded-lg px-2 py-1 text-xs font-bold outline-none cursor-pointer">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="kn">ಕನ್ನಡ</option>
            </select>
        </header>

        <div class="p-5 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-900 text-lg">Fresh Harvests Near You</h3>
                <button onclick="openLogisticsModal()" class="bg-blue-600 text-white text-[10px] font-bold px-3 py-2 rounded-xl shadow-sm"><i class="fas fa-truck mr-1"></i> Request Logistics</button>
            </div>
            <div id="marketFeed" class="space-y-5">
                <p class="text-center text-gray-500 italic">Loading crops...</p>
            </div>
        </div>

        <!-- 🚚 LOGISTICS BOOKING MODAL -->
        <div id="logisticsModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex-col justify-end">
            <div class="bg-white rounded-t-3xl p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-extrabold text-xl text-gray-900">Book Transport & Delivery</h3>
                    <button onclick="closeLogisticsModal()" class="text-gray-400"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <form id="logisticsForm" class="space-y-4" onsubmit="submitLogisticsRequest(event)">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Produce / Item Name</label>
                        <input type="text" id="logItemName" required placeholder="e.g., Organic Tomatoes" class="w-full border rounded-lg p-2.5 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Total Weight (kg)</label>
                            <input type="number" id="logQty" required placeholder="500" class="w-full border rounded-lg p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Vehicle Needed</label>
                            <select id="logVehicle" class="w-full border rounded-lg p-2.5 text-sm bg-white">
                                <option value="Small Tempo / Mini Truck">Small Tempo / Mini Truck</option>
                                <option value="Large Truck (5+ Ton)">Large Truck (5+ Ton)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Pickup Location</label>
                        <input type="text" id="logPickup" required placeholder="Farm address" class="w-full border rounded-lg p-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Drop-off Destination</label>
                        <input type="text" id="logDrop" required placeholder="Buyer Warehouse address" class="w-full border rounded-lg p-2.5 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md">Dispatch to Drivers</button>
                </form>
            </div>
        </div>

        <!-- Order Action Modal -->
        <div id="actionModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex-col justify-end">
            <div class="bg-white rounded-t-3xl p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-extrabold text-xl text-gray-900" id="modalTitle">Connect with Farmer</h3>
                    <button onclick="closeModal()" class="text-gray-400 bg-gray-100 rounded-full h-8 w-8 flex justify-center items-center"><i class="fas fa-times"></i></button>
                </div>
                
                <div id="menuOptions" class="space-y-3 mt-4 block">
                    <button onclick="openWhatsApp()" class="w-full bg-[#25D366] text-white py-4 px-4 rounded-xl flex items-center shadow-md">
                        <i class="fab fa-whatsapp text-2xl mr-3 w-6"></i>
                        <div class="text-left"><span class="block text-sm font-bold">WhatsApp Quick Chat</span></div>
                    </button>
                    <button onclick="showOrderForm()" class="w-full bg-gray-900 text-white py-4 px-4 rounded-xl flex items-center shadow-md">
                        <i class="fas fa-file-invoice text-2xl mr-3 w-6"></i>
                        <div class="text-left"><span class="block text-sm font-bold">Submit Formal Order</span></div>
                    </button>
                </div>

                <div id="orderForm" class="hidden mt-4 space-y-4">
                    <div class="bg-gray-50 p-3 rounded-lg border flex justify-between items-center mb-2">
                        <span class="text-sm font-bold text-gray-700" id="orderCropName"></span>
                        <span class="text-sm font-extrabold text-farmgreen" id="orderCropPrice"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Order Type</label>
                        <select id="orderType" onchange="calculateTotal()" class="w-full border rounded-lg p-2.5 text-sm bg-white">
                            <option value="B2C">B2C - Cash on Delivery (0% Advance)</option>
                            <option value="B2B">B2B - Wholesale (25% Advance Required)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Quantity (kg)</label>
                            <input type="number" id="orderQty" onkeyup="calculateTotal()" placeholder="e.g., 50" class="w-full border rounded-lg p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Your Phone</label>
                            <input type="tel" id="orderPhone" placeholder="10-digit" class="w-full border rounded-lg p-2.5 text-sm">
                        </div>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <div class="flex justify-between text-sm mb-1"><span class="text-gray-600">Total Invoice:</span><span id="calcTotal" class="font-bold">₹0</span></div>
                        <div class="flex justify-between text-sm"><span class="text-blue-800 font-bold">Advance to Pay Now:</span><span id="calcAdvance" class="font-extrabold text-lg text-blue-900">₹0</span></div>
                    </div>
                    <button onclick="submitOrderToDB()" id="confirmBtn" class="w-full bg-farmgreen text-white font-bold py-3.5 rounded-xl shadow-md">Process Secure Payment</button>
                    <p id="orderStatus" class="text-center font-bold text-sm hidden mt-2"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentCropName = "", currentCropPrice = 0, currentFarmerPhone = "";
        
        function openLogisticsModal() { document.getElementById('logisticsModal').classList.remove('hidden'); document.getElementById('logisticsModal').classList.add('flex'); }
        function closeLogisticsModal() { document.getElementById('logisticsModal').classList.add('hidden'); document.getElementById('logisticsModal').classList.remove('flex'); }

        async function submitLogisticsRequest(e) {
            e.preventDefault();
            const buyerUser = JSON.parse(localStorage.getItem('frendzy_buyer') || '{"phone":"9999999999"}');
            const payload = {
                item_name: document.getElementById('logItemName').value,
                quantity_kg: Number(document.getElementById('logQty').value),
                pickup_location: document.getElementById('logPickup').value,
                drop_location: document.getElementById('logDrop').value,
                requester_phone: buyerUser.phone || '9999999999',
                requester_role: 'BUYER',
                vehicle_required: document.getElementById('logVehicle').value
            };
            const res = await fetch('http://localhost:3000/api/logistics/request', {
                method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
            });
            if(res.ok) { alert("🚚 Transport request broadcasted to drivers!"); closeLogisticsModal(); document.getElementById('logisticsForm').reset(); }
        }

        async function loadMarketplace() {
            const feed = document.getElementById('marketFeed');
            try {
                const response = await fetch('http://localhost:3000/api/crops/feed');
                const json = await response.json();
                feed.innerHTML = ''; 
                json.data.reverse().forEach(crop => {
                    feed.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden mb-5">
                            <div class="h-48 w-full relative"><img src="${crop.image_url || 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?w=600&q=80'}" class="w-full h-full object-cover"></div>
                            <div class="p-5">
                                <h3 class="font-bold text-xl text-gray-900">${crop.product_details.crop_name}</h3>
                                <p class="font-extrabold text-2xl text-gray-900 mt-1">₹${crop.pricing.market_price_per_kg} <span class="text-xs text-gray-400">per kg</span></p>
                                <button onclick="openMenu('${crop.product_details.crop_name}', ${crop.pricing.market_price_per_kg}, '${crop.farmer_phone}')" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl mt-3 text-sm">Pre-Book Harvest</button>
                            </div>
                        </div>`;
                });
            } catch (err) { feed.innerHTML = '<p class="text-center text-red-500 font-bold">Error loading marketplace.</p>'; }
        }
        function openMenu(name, price, phone) {
            currentCropName = name; currentCropPrice = price; currentFarmerPhone = phone || '9999999999';
            document.getElementById('actionModal').classList.remove('hidden'); document.getElementById('actionModal').classList.add('flex');
        }
        function closeModal() { document.getElementById('actionModal').classList.add('hidden'); document.getElementById('actionModal').classList.remove('flex'); }
        function showOrderForm() { document.getElementById('menuOptions').classList.add('hidden'); document.getElementById('orderForm').classList.remove('hidden'); }
        function calculateTotal() {
            const qty = Number(document.getElementById('orderQty').value) || 0;
            const type = document.getElementById('orderType').value;
            const total = qty * currentCropPrice;
            document.getElementById('calcTotal').innerText = `₹${total}`;
            document.getElementById('calcAdvance').innerText = `₹${type === 'B2B' ? total * 0.25 : 0}`;
        }
        async function submitOrderToDB() {
            await fetch('http://localhost:3000/api/orders', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ crop_name: currentCropName, price_per_kg: currentCropPrice, quantity_kg: Number(document.getElementById('orderQty').value), buyer_phone: document.getElementById('orderPhone').value, farmer_phone: currentFarmerPhone, order_type: document.getElementById('orderType').value })
            });
            alert("Order confirmed!"); closeModal();
        }
        loadMarketplace();
    </script>
</body>
</html>
