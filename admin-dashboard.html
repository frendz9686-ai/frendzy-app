<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy - Admin Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col h-full shadow-2xl z-20">
        <div class="p-6 border-b border-gray-800">
            <h2 class="font-extrabold text-2xl text-white"><span class="text-green-500">Frendzy</span> Admin</h2>
            <p class="text-gray-400 text-xs mt-1">Master Control Panel</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block py-3 px-4 rounded-xl bg-gray-800 text-white font-bold transition"><i class="fas fa-layer-group w-6"></i> Global Categories</a>
            <a href="farmer-dashboard.html" class="block py-3 px-4 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-tractor w-6"></i> Farmer Dashboard</a>
            <a href="supplier-dashboard.html" class="block py-3 px-4 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-store w-6"></i> Supplier Portal</a>
        </nav>
        <div class="p-6 border-t border-gray-800">
            <a href="farmer-dashboard.html" class="block text-center w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg transition text-sm">Exit Admin</a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 h-full overflow-y-auto bg-gray-50">
        <header class="bg-white shadow-sm p-6 flex justify-between items-center sticky top-0 z-10">
            <div>
                <h1 class="font-bold text-2xl text-gray-900">Global Categories Control</h1>
                <p class="text-gray-500 text-sm mt-1">Manage what categories appear in Supplier Stores, Farmer Listings, and Machinery Rentals[cite: 6].</p>
            </div>
            <button onclick="openAddCategoryModal()" class="bg-gray-900 hover:bg-black text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition flex items-center">
                <i class="fas fa-plus mr-2"></i> Create Category
            </button>
        </header>

        <div class="p-8">
            <!-- Target Tabs Switcher (Includes MACHINERY)[cite: 6] -->
            <div class="flex bg-gray-200 p-1 rounded-xl max-w-md mb-6">
                <button onclick="switchAdminTab('SUPPLIER')" id="tabSupplier" class="flex-1 py-2 text-xs font-bold bg-white text-gray-900 rounded-lg shadow-sm transition">Supplier Store</button>
                <button onclick="switchAdminTab('FARMER')" id="tabFarmer" class="flex-1 py-2 text-xs font-bold text-gray-500 rounded-lg transition">Farmer Marketplace</button>
                <button onclick="switchAdminTab('MACHINERY')" id="tabMachinery" class="flex-1 py-2 text-xs font-bold text-gray-500 rounded-lg transition">Machinery Rental</button>
            </div>

            <!-- Category Grid -->
            <div id="adminCategoryGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <p class="text-gray-500 italic">Loading categories...</p>
            </div>
        </div>
    </main>

    <!-- 📦 ADD NEW CATEGORY MODAL -->
    <div id="addCategoryModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 justify-center items-center">
        <div class="bg-white rounded-2xl p-8 shadow-2xl w-full max-w-md relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-extrabold text-xl text-gray-900">Add Global Category</h3>
                <button onclick="closeAddCategoryModal()" class="text-gray-400 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <form id="addCategoryForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Target Dashboard</label>
                    <select id="catTarget" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-gray-900 outline-none bg-white font-bold">
                        <option value="SUPPLIER">Supplier Store (Agri-Inputs)</option>
                        <option value="FARMER">Farmer Marketplace (Crops & Produce)</option>
                        <option value="MACHINERY">Machinery Rental (Tractors, JCBs, etc.)[cite: 6]</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Category Name</label>
                    <input type="text" id="catName" required placeholder="e.g., Harvesters" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-gray-900 outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Icon Style</label>
                        <select id="catIcon" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-gray-900 outline-none bg-white">
                            <option value="fa-seedling">Seedling</option>
                            <option value="fa-apple-alt">Fruit</option>
                            <option value="fa-carrot">Vegetable</option>
                            <option value="fa-egg">Egg / Dairy</option>
                            <option value="fa-tractor">Tractor</option>
                            <option value="fa-truck-monster">Monster Truck / JCB</option>
                            <option value="fa-wheat-awn">Harvester</option>
                            <option value="fa-truck">Tipper / Truck</option>
                            <option value="fa-spray-can">Spray</option>
                            <option value="fa-flask">Flask</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Theme Color</label>
                        <select id="catColor" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-gray-900 outline-none bg-white">
                            <option value="green">Green</option>
                            <option value="orange">Orange</option>
                            <option value="red">Red</option>
                            <option value="blue">Blue</option>
                            <option value="amber">Amber</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" id="saveCatBtn" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-md transition mt-4">
                    Publish Category
                </button>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let currentTarget = 'SUPPLIER';

        function switchAdminTab(target) {
            currentTarget = target;
            ['SUPPLIER', 'FARMER', 'MACHINERY'].forEach(t => {
                const btnId = 'tab' + t.charAt(0) + t.slice(1).toLowerCase();
                const btn = document.getElementById(btnId);
                if (t === target) {
                    btn.className = "flex-1 py-2 text-xs font-bold bg-white text-gray-900 rounded-lg shadow-sm transition";
                } else {
                    btn.className = "flex-1 py-2 text-xs font-bold text-gray-500 rounded-lg transition";
                }
            });
            fetchGlobalCategories();
        }

        async function fetchGlobalCategories() {
            const grid = document.getElementById('adminCategoryGrid');
            try {
                const res = await fetch(`http://localhost:3000/api/admin/categories?target=${currentTarget}`);
                const categories = await res.json();
                
                if (categories.length === 0) {
                    grid.innerHTML = `<p class="text-gray-500 italic col-span-full">No categories found for ${currentTarget}.</p>`;
                    return;
                }

                grid.innerHTML = '';
                categories.forEach(cat => {
                    grid.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition">
                            <div class="flex items-center">
                                <div class="h-12 w-12 ${cat.bg} ${cat.color} rounded-xl flex items-center justify-center mr-4">
                                    <i class="fas ${cat.icon} text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-900">${cat.name}</h3>
                                    <span class="text-[9px] bg-gray-100 text-gray-600 font-bold px-2 py-0.5 rounded">${cat.target || 'SUPPLIER'}</span>
                                </div>
                            </div>
                            <button onclick="deleteCategory('${cat._id}', '${cat.name}')" class="text-gray-400 hover:text-red-600 transition p-2">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = '<p class="text-red-500">Failed to load categories.</p>';
            }
        }

        async function deleteCategory(id, name) {
            if(!confirm(`WARNING: Are you sure you want to delete "${name}"?`)) return;
            try {
                await fetch(`http://localhost:3000/api/admin/categories/${id}`, { method: 'DELETE' });
                fetchGlobalCategories();
            } catch(e) {
                alert("Failed to delete category.");
            }
        }

        function openAddCategoryModal() {
            document.getElementById('catTarget').value = currentTarget;
            const modal = document.getElementById('addCategoryModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAddCategoryModal() {
            const modal = document.getElementById('addCategoryModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            document.getElementById('addCategoryForm').reset();
        }

        document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const colorSelection = document.getElementById('catColor').value;
            const colorMap = {
                'green': { text: 'text-green-600', bg: 'bg-green-50' },
                'orange': { text: 'text-orange-600', bg: 'bg-orange-50' },
                'red': { text: 'text-red-600', bg: 'bg-red-50' },
                'blue': { text: 'text-blue-600', bg: 'bg-blue-50' },
                'amber': { text: 'text-amber-600', bg: 'bg-amber-50' }
            };

            const payload = {
                name: document.getElementById('catName').value.trim(),
                target: document.getElementById('catTarget').value,
                icon: document.getElementById('catIcon').value,
                color: colorMap[colorSelection].text,
                bg: colorMap[colorSelection].bg
            };

            try {
                const res = await fetch('http://localhost:3000/api/admin/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeAddCategoryModal();
                    fetchGlobalCategories();
                } else {
                    alert("Server failed to save category.");
                }
            } catch (err) {
                alert("Network error connecting to backend.");
            }
        });

        fetchGlobalCategories();
    </script>
</body>
</html>
