<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { farmgreen: '#16a34a' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 relative">
        <div class="text-center mb-6">
            <h2 class="font-extrabold text-3xl text-gray-900"><span class="text-farmgreen">Frendzy</span></h2>
            <p class="text-sm text-gray-500 font-medium">Empowering the agricultural economy</p>
        </div>

        <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
            <button onclick="toggleMode('login')" id="loginTab" class="w-1/2 bg-white shadow text-sm font-bold py-2 rounded-md transition">Log In</button>
            <button onclick="toggleMode('signup')" id="signupTab" class="w-1/2 text-gray-500 text-sm font-bold py-2 rounded-md transition">Sign Up</button>
        </div>

        <div class="space-y-4">
            <div id="nameField" class="hidden">
                <label class="block text-xs font-bold text-gray-700 mb-1">Full Name</label>
                <input type="text" id="authName" class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none focus:border-farmgreen">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Phone Number</label>
                <input type="tel" id="authPhone" placeholder="10-digit number" class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none focus:border-farmgreen">
            </div>

            <!-- Password OR OTP Input -->
            <div id="authSecretField">
                <div class="flex justify-between items-center mb-1">
                    <label id="secretLabel" class="block text-xs font-bold text-gray-700">Password</label>
                    <!-- OTP Toggle Button -->
                    <button onclick="toggleOtpMode()" id="otpToggleBtn" class="text-[10px] font-bold text-blue-600 hover:underline">Use OTP Instead</button>
                </div>
                <div class="flex gap-2">
                    <input type="password" id="authSecret" placeholder="••••••••" class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none focus:border-farmgreen">
                    <button onclick="requestOtp()" id="getOtpBtn" class="hidden bg-gray-900 text-white text-xs font-bold px-4 rounded-lg hover:bg-black whitespace-nowrap">Get OTP</button>
                </div>
            </div>

            <div id="roleField" class="hidden">
                <label class="block text-xs font-bold text-gray-700 mb-1">I am a...</label>
                <select id="authRole" class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none focus:border-farmgreen">
                    <option value="FARMER">Farmer</option>
                    <option value="BUYER">Buyer</option>
                </select>
            </div>

            <button onclick="submitAuth()" id="submitBtn" class="w-full bg-farmgreen hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-md mt-4 transition">
                Log In Securely
            </button>
            <p id="authMessage" class="text-center text-sm font-bold mt-2 hidden"></p>
        </div>
    </div>

    <script>
        let isLogin = true;
        let useOtp = false;

        function toggleMode(mode) {
            isLogin = (mode === 'login');
            useOtp = false; // Reset OTP mode on switch
            updateUI();
        }

        function toggleOtpMode() {
            useOtp = !useOtp;
            updateUI();
        }

        function updateUI() {
            document.getElementById('loginTab').className = isLogin ? "w-1/2 bg-white shadow text-sm font-bold py-2 rounded-md" : "w-1/2 text-gray-500 text-sm font-bold py-2 rounded-md";
            document.getElementById('signupTab').className = !isLogin ? "w-1/2 bg-white shadow text-sm font-bold py-2 rounded-md" : "w-1/2 text-gray-500 text-sm font-bold py-2 rounded-md";
            
            document.getElementById('nameField').style.display = isLogin ? 'none' : 'block';
            document.getElementById('roleField').style.display = isLogin ? 'none' : 'block';
            document.getElementById('submitBtn').innerText = isLogin ? 'Log In Securely' : 'Create Account';
            
            const secretInput = document.getElementById('authSecret');
            const toggleBtn = document.getElementById('otpToggleBtn');
            const getOtpBtn = document.getElementById('getOtpBtn');
            const secretLabel = document.getElementById('secretLabel');

            if (!isLogin) {
                // Signup always requires a password
                secretLabel.innerText = "Create Password";
                secretInput.type = "password";
                secretInput.placeholder = "••••••••";
                toggleBtn.classList.add('hidden');
                getOtpBtn.classList.add('hidden');
            } else {
                toggleBtn.classList.remove('hidden');
                if (useOtp) {
                    secretLabel.innerText = "Enter 4-Digit OTP";
                    secretInput.type = "number";
                    secretInput.placeholder = "----";
                    toggleBtn.innerText = "Use Password Instead";
                    getOtpBtn.classList.remove('hidden');
                } else {
                    secretLabel.innerText = "Password";
                    secretInput.type = "password";
                    secretInput.placeholder = "••••••••";
                    toggleBtn.innerText = "Use OTP Instead";
                    getOtpBtn.classList.add('hidden');
                }
            }
        }

        async function requestOtp() {
            const phone = document.getElementById('authPhone').value;
            const msg = document.getElementById('authMessage');
            if (!phone) return alert("Please enter your phone number first.");

            document.getElementById('getOtpBtn').innerText = 'Sending...';
            try {
                const response = await fetch('http://localhost:3000/api/request-otp', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone })
                });
                if (response.ok) {
                    msg.innerText = "✅ OTP sent! Check your terminal.";
                    msg.className = "text-center text-sm font-bold mt-2 block text-green-600";
                } else {
                    const data = await response.json();
                    msg.innerText = `❌ ${data.error}`;
                    msg.className = "text-center text-sm font-bold mt-2 block text-red-500";
                }
            } catch (err) { alert("Error connecting to server."); }
            document.getElementById('getOtpBtn').innerText = 'Get OTP';
        }

        async function submitAuth() {
            const phone = document.getElementById('authPhone').value;
            const secret = document.getElementById('authSecret').value;
            const msg = document.getElementById('authMessage');
            
            if (!phone || !secret) {
                msg.innerText = "Please fill in all fields.";
                msg.className = "text-center text-sm font-bold mt-2 block text-red-500"; return;
            }

            // Route dynamically based on what the user is doing
            let endpoint = '/api/signup';
            let payload = { phone, password: secret, name: document.getElementById('authName').value, role: document.getElementById('authRole').value };

            if (isLogin) {
                endpoint = useOtp ? '/api/verify-otp' : '/api/login';
                payload = useOtp ? { phone, otp: secret } : { phone, password: secret };
            }

            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const response = await fetch(`http://localhost:3000${endpoint}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    msg.innerText = "✅ Success!";
                    msg.className = "text-center text-sm font-bold mt-2 block text-green-600";
                    if (isLogin) {
                        localStorage.setItem('frendzy_token', data.token);
                        setTimeout(() => window.location.href = data.user.role === 'FARMER' ? 'farmer-dashboard.html' : 'buyer-feed.html', 1000);
                    } else {
                        setTimeout(() => toggleMode('login'), 1500);
                    }
                } else {
                    msg.innerText = `❌ ${data.error}`;
                    msg.className = "text-center text-sm font-bold mt-2 block text-red-500";
                }
            } catch (err) { msg.innerText = "❌ Connection failed."; msg.className = "text-center text-sm font-bold mt-2 block text-red-500"; }
            
            document.getElementById('submitBtn').innerText = isLogin ? 'Log In Securely' : 'Create Account';
        }
    </script>
</body>
</html>
